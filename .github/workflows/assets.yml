name: Build visual assets

on:
  push:
    paths:
      - "assets/spec.json"
      - ".github/workflows/assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    uses: cmj-hub/.github/.github/workflows/regenerate-assets.yml@main
    with:
      pack_name: claude-cold-email
    secrets:
      CMJ_HUB_DOTGITHUB_READ_PAT: ${{ secrets.CMJ_HUB_DOTGITHUB_READ_PAT }}
