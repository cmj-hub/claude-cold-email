# JMC skill-pack CI
# Validates SKILL.md frontmatter, lints Python scripts, runs smoke tests.
# Runs on every PR + every push to main.
#
# No secrets required. Free unlimited minutes on public repos.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate SKILL.md frontmatter
        run: python3 scripts/validate-skill-frontmatter.py

      - name: Every SKILL.md lives under skills/ (plugin loader only scans there)
        run: |
          stray=$(find . -name SKILL.md -not -path './skills/*' -not -path './.git/*' -not -path './node_modules/*')
          if [ -n "$stray" ]; then
            echo "  ✗ SKILL.md outside skills/ will not load as a plugin skill:"
            echo "$stray"
            exit 1
          fi
          echo "  ✓ $(find skills -name SKILL.md | wc -l) skills under skills/"

      - name: Check file references in skills, agents, and docs
        run: python3 scripts/check_refs.py

      - name: Validate brand-config.example.json
        run: |
          if [ -f brand-config.example.json ]; then
            python3 - <<'PY'
          import json
          cfg = json.load(open("brand-config.example.json"))
          schema = json.load(open("brand-config.schema.json"))
          def check(node, sch, path):
              for key in sch.get("required", []):
                  if key not in node:
                      raise SystemExit(f"  ✗ brand-config.example.json missing {path}{key}")
              for key, sub in sch.get("properties", {}).items():
                  if key in node and isinstance(node[key], dict) and sub.get("type") == "object":
                      check(node[key], sub, f"{path}{key}.")
          check(cfg, schema, "")
          print("  ✓ brand-config.example.json is valid JSON with every required schema key")
          PY
          else
            echo "  (no brand-config.example.json — skip)"
          fi

      - name: Validate plugin.json
        run: |
          python3 -c "
          import json
          d = json.load(open('.claude-plugin/plugin.json'))
          required = ['name', 'version', 'description', 'license']
          missing = [k for k in required if k not in d]
          if missing:
              print(f'  ✗ plugin.json missing: {missing}')
              exit(1)
          print(f'  ✓ plugin.json valid: name={d[\"name\"]}, version={d[\"version\"]}')
          "

      - name: Validate shell script syntax
        run: |
          for f in install.sh scripts/*.sh; do
            bash -n "$f" && echo "  ✓ $f: bash syntax OK"
          done

  lint-python:
    name: Lint Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile-check all Python scripts
        run: |
          shopt -s nullglob
          fails=0
          for f in scripts/*.py tests/*.py; do
            if python3 -m py_compile "$f" 2>&1; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f"
              fails=$((fails + 1))
            fi
          done
          if [ "$fails" -gt 0 ]; then exit 1; fi

      - name: Verify scripts are zero-dep (stdlib only)
        run: |
          shopt -s nullglob
          fails=0
          for f in scripts/*.py; do
            # Reject any non-stdlib import (anything with a `requirements.txt`-style package name)
            forbidden=$(grep -hE "^(import|from)\s+(requests|httpx|pillow|PIL|numpy|pandas|matplotlib|cairosvg|playwright|anthropic|openai|google\.generativeai)" "$f" || true)
            if [ -n "$forbidden" ]; then
              echo "  ✗ $f imports non-stdlib package — packs must be zero-dep:"
              echo "$forbidden"
              fails=$((fails + 1))
            else
              echo "  ✓ $f (stdlib only)"
            fi
          done
          if [ "$fails" -gt 0 ]; then exit 1; fi

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run tests/
        run: python3 -m unittest discover -s tests -v

  smoke-test:
    name: Smoke-test scoring scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run pack-specific smoke tests
        run: |
          if [ -x scripts/smoke-test.sh ]; then
            bash scripts/smoke-test.sh
          else
            echo "  (no scripts/smoke-test.sh — skipping)"
          fi
